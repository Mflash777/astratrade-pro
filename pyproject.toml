[tool.ruff]
line-length = 170
target-version = "py311"
exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E731", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
